composition_id: weather_land_battery
description: Runs weather, landing control, and the drone platform subsystem for a landing task.
inputs:
  time_s:
    type: float
    unit: s
    required: true
    where:
    - self >= 0.0
  position_m:
    type: 'list[float]'
    unit: m
    items:
      where:
      - self >= -100000.0
      - self <= 100000.0
    required: true
    where:
    - len(self) == 3
    - 'self[2] >= 0.0'
    - 'self[2] <= 3000.0'
  heading_rad:
    type: float
    unit: rad
    required: true
    where:
    - self >= -3.141592653589793
    - self <= 3.141592653589793
  landing_position_m:
    type: 'list[float]'
    unit: m
    items:
      where:
      - self >= -100000.0
      - self <= 100000.0
    required: true
    where:
    - len(self) == 3
    - 'self[2] >= 0.0'
    - 'self[2] <= 3000.0'
  commanded_speed_mps:
    type: float
    unit: m/s
    required: true
    where:
    - self > 0.0
    - self <= 22.0
  acceptance_radius_m:
    type: float
    unit: m
    required: true
    where:
    - self > 0.0
    - self <= 1000.0
  soc_percent:
    type: float
    unit: percent
    required: true
    where:
    - self >= 0.0
    - self <= 100.0
    - self >= inputs.reserve_soc_percent
  reserve_soc_percent:
    type: float
    unit: percent
    required: true
    where:
    - self >= 0.0
    - self <= 100.0
  base_wind_mps:
    type: 'list[float]'
    unit: m/s
    items:
      where:
      - self >= -100.0
      - self <= 100.0
    required: true
    where:
    - len(self) == 3
    - 'self[0] * self[0] + self[1] * self[1] <= 64.0'
  base_temperature_c:
    type: float
    unit: degC
    required: true
    where:
    - self >= -50.0
    - self <= 60.0
  payload_kg:
    type: float
    unit: kg
    required: true
    where:
    - self >= 0.0
    - self <= 10.0
  dt_s:
    type: float
    unit: s
    required: true
    where:
    - self > 0.0
    - self <= 60.0
  voltage_v:
    type: float
    unit: V
    required: true
    where:
    - self >= 18.0
    - self <= 25.2
  battery_temperature_c:
    type: float
    unit: degC
    required: true
    where:
    - self >= -40.0
    - self <= 60.0
  health_percent:
    type: float
    unit: percent
    required: true
    where:
    - self > 0.0
    - self <= 100.0
outputs:
  next_position_m:
    from: $platform.next_position_m
    type: 'list[float]'
    unit: m
    items:
      where:
      - self >= -100000.0
      - self <= 100000.0
    where:
    - len(self) == 3
  next_heading_rad:
    from: $platform.next_heading_rad
    type: float
    unit: rad
  task_complete:
    from: $control.task_complete
    type: bool
  task_elapsed_s:
    from: $control.task_elapsed_s
    type: float
    unit: s
    where:
    - self >= 0.0
  control_warnings:
    from: $control.warnings
    type: 'list[str]'
    where:
    - len(self) >= 0
    - len(self) <= 16
  drone_warnings:
    from: $platform.drone_warnings
    type: 'list[str]'
    where:
    - len(self) >= 0
    - len(self) <= 16
  battery_warnings:
    from: $platform.battery_warnings
    type: 'list[str]'
    where:
    - len(self) >= 0
    - len(self) <= 16
  next_soc_percent:
    from: $platform.next_soc_percent
    type: float
    unit: percent
    where:
    - self >= 0.0
    - self <= 100.0
    - self <= inputs.soc_percent
  next_voltage_v:
    from: $platform.next_voltage_v
    type: float
    unit: V
    where:
    - self >= 0.0
  next_battery_temperature_c:
    from: $platform.next_battery_temperature_c
    type: float
    unit: degC
    where:
    - self >= -50.0
    - self <= 100.0
  next_health_percent:
    from: $platform.next_health_percent
    type: float
    unit: percent
    where:
    - self > 0.0
    - self <= 100.0
    - self == inputs.health_percent
  next_time_s:
    from: $platform.next_time_s
    type: float
    unit: s
    where:
    - self > 0.0
    - self == inputs.time_s + inputs.dt_s
nodes:
- id: weather
  model: weather
  inputs:
    time_s: $inputs.time_s
    position_m: $inputs.position_m
    base_wind_mps: $inputs.base_wind_mps
    base_temperature_c: $inputs.base_temperature_c
- id: control
  model: land
  inputs:
    position_m: $inputs.position_m
    heading_rad: $inputs.heading_rad
    time_s: $inputs.time_s
    landing_position_m: $inputs.landing_position_m
    commanded_speed_mps: $inputs.commanded_speed_mps
    acceptance_radius_m: $inputs.acceptance_radius_m
    dt_s: $inputs.dt_s
- id: platform
  composition: drone_platform
  inputs:
    position_m: $inputs.position_m
    heading_rad: $inputs.heading_rad
    time_s: $inputs.time_s
    commanded_velocity_mps: $control.commanded_velocity_mps
    wind_mps: $weather.wind_mps
    air_density_kg_m3: $weather.air_density_kg_m3
    ambient_temperature_c: $weather.temperature_c
    payload_kg: $inputs.payload_kg
    dt_s: $inputs.dt_s
    soc_percent: $inputs.soc_percent
    reserve_soc_percent: $inputs.reserve_soc_percent
    voltage_v: $inputs.voltage_v
    battery_temperature_c: $inputs.battery_temperature_c
    health_percent: $inputs.health_percent
    max_continuous_power_w: 900.0
    max_peak_power_w: 1400.0

