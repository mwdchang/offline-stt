<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
    <style>
      html, body {
        height: 100%;
        width: 100%;
        display: flex;
      }
      #app {
        height: 100%;
        width: 100%;
      }

:root {
	--editing-color: rgb(238, 238, 136);
	--border-radius-small: #{$smallBorderRadius};
	--border-radius: #{$borderRadius};
	--border-radius-medium: #{$mediumBorderRadius};
	--border-radius-big: #{$bigBorderRadius};
	--border-radius-bigger: #{$biggerBorderRadius};
	--button-color: #{$successButtonBg};
	--chevron-hover: #1b807332;
	--content-padding: #{$panelContentPadding};
	--error-message-color: #{$errorMessageTextColor};
	--focus-ring: #{$focusShadow};
	--font-body-large: #{$fontBodyLarge};
	--font-body-medium: #{$fontBodyMedium};
	--font-body-small: #{$fontBodySmall};
	--font-caption: #{$fontCaption};
	--font-tiny: #{$fontTiny};
	--font-family: #{$fontFamily};
	--font-size: #{$fontSize};
	--font-weight: #{$fontWeight};
	--font-weight-semibold: #{$fontWeightSemiBold};
	--gray-0: #FFFFFF;
	--gray-50: #FAFAFA;
	--gray-100: #F5F5F5;
	--gray-200: #EEEEEE;
	--gray-300: #E0E0E0;
	--gray-400: #BDBDBD;
	--gray-500: #9E9E9E;
	--gray-600: #757575;
	--gray-700: #616161;
	--gray-800: #424242;
	--gray-900: #212121;
	--gray-1000: #000000;
	--inline-spacing: #{$inlineSpacing};
	--maskbg: #{$maskBg};
	--modal-border-radius: 6px;
	--primary-color: #{$primaryColor};
	--primary-color-hover: #{$primaryColorHover};
	--primary-color-dark: #{$primaryColorDark};
	--primary-color-lighter: #{$primaryColorLighter};
	--primary-color-light: #{$primaryColorLight};
	--primary-color-text: #{$primaryTextColor};
	--surface-0: #ffffff;
	--surface-50: #FAFAFA;
	--surface-100: #F5F5F5;
	--surface-200: #EEEEEE;
	--surface-300: #E0E0E0;
	--surface-400: #BDBDBD;
	--surface-500: #9E9E9E;
	--surface-600: #757575;
	--surface-700: #616161;
	--surface-800: #424242;
	--surface-900: #212121;
	--surface-a: #ffffff;
	--surface-b: #fafafa;
	--surface-border: #D0D5DD;
	--surface-border-alt: #CACBCC; /* Eventually we may settle with one of these border colors */
	--surface-border-hover: #{$primaryColorLighter};
	--surface-border-light: #EAEAEA;
	--surface-border-dark: #BCC3CD;
	--surface-border-warning: #D92D20;
	--surface-c: rgba(0, 0, 0, .04);
	--surface-card: #ffffff;
	--surface-d: rgba(0, 0, 0, .12);
	--surface-e: #ffffff;
	--surface-f: #ffffff;
	--surface-overlay: #ffffff;
	--surface-ground: var(--gray-100);
	--surface-ground-transparent: rgba(245, 245, 245, .85);
	--surface-glass: rgba(255, 255, 255, 0.8);
	--surface-disabled: #F4F4F4;
	--surface-highlight: #EBF4F3;
	--surface-highlight-hover: #bddad6;
	--surface-warning: #FEC;
	--warning-color: #FFAB00;
	--surface-error: #FFDCDC;
	--error-color: #b61919;
	--error-background: rgba(243, 215, 208, 0.5);
	--error-border-color: #F89A7C;
	--surface-hover: var(--gray-100);
	--surface-secondary: #f9fbfa;
	--surface-section: #ffffff;
	--surface-transparent: #F4F4F4cc;
	--tab-backgroundcolor-unselected: #DEE4EB;
	--text-color: #{$textColor};
	--text-color-disabled: rgb(208, 213, 221);
	--text-color-primary: #{$textColor};
	--text-color-secondary: #{$textSecondaryColor};
	--text-color-subdued: rgb(102, 112, 133);
	--text-color-light: rgb(152, 154, 160);
	--text-color-danger: #{$dangerTextButton};
	--constrain-width: 55rem;
	color-scheme: light;
	--port-base-size: 8px;
	--overlay-menu-shadow: 0 0 0 1px rgba(0, 0, 0, 0.1), 0 2px 4px 0 rgba(0, 0, 0, 0.2);
	--overlay-menu-shadow-hover: 0 0 0 1px rgba(0, 0, 0, 0.1), 0 2px 8px 0 rgba(0, 0, 0, 0.3);
	--node-header: #7b8498;
	--node-header-hover: var(--text-color-subdued);
	--z-index-modal: 1000;
	--keyboard-zindex: calc(var(--z-index-modal) + 100);

	// tailwind gaps as variables used in app
	--gap-0-5: 0.125rem; 			// 2px
	--gap-1: 0.25rem;					// 4px
	--gap-1-5: 0.375rem;			// 6px
	--gap-2: 0.5rem;					// 8px
	--gap-2-5: 0.625rem;			// 10px
	--gap-3: 0.75rem;					// 12px
	--gap-3-5: 0.875rem;			// 14px
	--gap-4: 1rem; 						// 16px
	--gap-5: 1.25rem;					// 20px
	--gap-6: 1.5rem;					// 24px
	--gap-7: 1.75rem;					// 28px
	--gap-8: 2rem;						// 32px
	--gap-9: 2.25rem;					// 36px
	--gap-10: 2.5rem;					// 40px
	--gap-11: 2.75rem;				// 44px
	--gap-12: 3rem;						// 48px
}

    </style>
  </head>
  <body> 
    <div id="app" style="display: flex; flex-direction: column"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
