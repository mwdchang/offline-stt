<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Voice Whisper POC</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .container div {
          color: #382;
        }

        h1 { color: #333; }
        p { color: #666; margin-bottom: 2rem; }
        button {
            padding: 0.8rem 1.2rem;
            font-size: 1.0rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #007bff;
            color: white;
            transition: background-color 0.2s;
        }
        button:hover { background-color: #0056b3; }
        button.recording { background-color: #dc3545; }
        button.recording:hover { background-color: #a71d2a; }
        #status { margin-top: 1rem; font-weight: bold; color: #555; }
    </style>
    <!--
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
    -->
    <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <h3>VAD + Whisper Speech to Text</h3>
        <p style="grey">Speak into the mic, translation starts when you take a short pause.</p>
        <div id="container"></div>
    </div>
    <script type="module">

      function encodeWAV(samples, sampleRate = 16000) {
        const start = Date.now();
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);

        const writeString = (offset, str) => {
          for (let i = 0; i < str.length; i++) {
            view.setUint8(offset + i, str.charCodeAt(i));
          }
        };

        writeString(0, "RIFF");
        view.setUint32(4, 36 + samples.length * 2, true);
        writeString(8, "WAVE");
        writeString(12, "fmt ");
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);      // PCM
        view.setUint16(22, 1, true);      // mono
        view.setUint32(24, sampleRate, true);
        view.setUint32(28, sampleRate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        writeString(36, "data");
        view.setUint32(40, samples.length * 2, true);

        let offset = 44;
        for (let i = 0; i < samples.length; i++) {
          const s = Math.max(-1, Math.min(1, samples[i]));
          view.setInt16(
            offset,
            s < 0 ? s * 0x8000 : s * 0x7fff,
            true
          );
          offset += 2;
        }
        const end = Date.now();
        console.log('encoding time', (end - start));

        return new Blob([buffer], { type: "audio/wav" });
      }


      // VAD - voice activity detection
      async function main() {
        const transcribeSpeechWAV = async (wavBlob) => {
          const formData = new FormData();
          formData.append('audio', wavBlob, 'recording.wav');
          formData.append('context', '');

          try {
            const response = await fetch('/upload-proxy', {
              method: 'POST',
              body: formData
            });
            const result = await response.json();
            console.log('Server response:', result);

            if (result.python && result.python.text) {
              const msg = document.createElement('div')
              msg.innerHTML = result.python.text;
              document.getElementById('container').appendChild(msg);
            }
          } catch (err) {
            console.error(err);
          } finally {
          }
        }

        const myvad = await vad.MicVAD.new({
          // Tuning
          positiveSpeechThreshold: 0.65,

          // Increase to shorten speech end detection
          negativeSpeechThreshold: 0.5,

          redemptionFrames: 5,
          preSpeechPadFrames: 10,
          minSpeechFrames: 1,

          onSpeechStart: () => {
          },
          onSpeechEnd: async (audio) => {
            const wav = encodeWAV(audio);
            transcribeSpeechWAV(wav);
          },
          onnxWASMBasePath: "https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/",
          baseAssetPath: "https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/",
          debug: false,
          logging: false,
        })
        myvad.start();
      }
      main();
    </script>
</body>
</html>
